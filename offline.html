<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SakayKo — Offline</title>
  <meta name="theme-color" content="#FF6B3D">
  <style>
    body { font-family: system-ui, -apple-system, 'DM Sans', 'Segoe UI', Roboto, Arial; background:#141C28; color:#EDF3FB; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .card { text-align:center; background:#1D2738; padding:28px; border-radius:14px; box-shadow:0 8px 32px rgba(0,0,0,.5); max-width:520px; }
    h1 { margin:0 0 8px; font-size:20px; }
    p { color:#9DB4CA; margin:6px 0 0; }
    a { display:inline-block; margin-top:16px; background:#FF6B3D; color:white; padding:10px 16px; border-radius:999px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:48px;margin-bottom:8px">🚐</div>
    <h1>Wala kang koneksyon</h1>
    <p>Hindi available ang network. Maaari mong i-refresh kapag may internet.</p>
    <a href="./">Buksan ang app</a>
  </div>
</body>
</html>
